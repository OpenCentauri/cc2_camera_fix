[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cc2flash"
version = "0.4.0"
description = "Safety-focused backup/restore client for the Elegoo CC2 stock camera"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
usb = ["hidapi>=0.14"]

[project.scripts]
cc2flash = "cc2flash.cli:main"

[tool.setuptools]
packages = ["cc2flash"]
