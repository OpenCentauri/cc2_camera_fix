name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m cc2camera --help
      - run: python packaging/smoke_test.py cc2camera
      - name: Install executable builder
        if: matrix.os == 'windows-2022' && matrix.python == '3.12'
        run: python -m pip install pyinstaller==6.22.2
      - name: Build and test the Windows executable without publishing
        if: matrix.os == 'windows-2022' && matrix.python == '3.12'
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --name cc2camera --hidden-import hid packaging/entrypoint.py
          if ($LASTEXITCODE -ne 0) { throw 'Executable build failed' }
          python packaging/smoke_test.py dist/cc2camera.exe

  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install zizmor==1.30.0
      - name: Audit all workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --strict-collection .github/workflows
