name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m cc2flash --help
      - name: Install executable builder
        if: matrix.os == 'windows-2022' && matrix.python == '3.12'
        run: python -m pip install pyinstaller==6.22.2
      - name: Build and test the Windows executable without publishing
        if: matrix.os == 'windows-2022' && matrix.python == '3.12'
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --name cc2flash --hidden-import hid packaging/entrypoint.py
          if ($LASTEXITCODE -ne 0) { throw 'Executable build failed' }
          python packaging/smoke_test.py dist/cc2flash.exe
