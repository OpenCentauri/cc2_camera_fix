name: Build release executable

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install package and executable builder
        run: python -m pip install . pyinstaller==6.22.2
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build console executable
        run: python -m PyInstaller --clean --noconfirm --onefile --console --name cc2flash --hidden-import hid packaging/entrypoint.py
      - name: Smoke-test frozen application outside source tree
        run: python packaging/smoke_test.py dist/cc2flash.exe
      - name: Hash executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/cc2flash.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cc2flash.exe" | Set-Content dist/cc2flash.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: release-executable
          path: |
            dist/cc2flash.exe
            dist/cc2flash.exe.sha256
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-executable
          path: dist
      - name: Attach to the existing manually published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/cc2flash.exe dist/cc2flash.exe.sha256
